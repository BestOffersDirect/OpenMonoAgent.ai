<svg xmlns="http://www.w3.org/2000/svg" width="800" height="306" viewBox="0 0 800 306" role="img" aria-label="Linux NVIDIA GPU and CPU support. AMD and other GPUs are not supported yet.">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono','Cascadia Code','Fira Code',ui-monospace,monospace; }
      .col { font-size: 9.5px; fill: #7E887C; letter-spacing: 1px; }
      .spec { font-size: 11px; font-weight: 600; }
      .val { font-size: 11px; fill: #C9D2C6; }
      .val-dim { font-size: 11px; fill: #8C968A; }
      .foot { font-size: 9.5px; fill: #7E887C; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0F0A"/>
      <stop offset="1" stop-color="#070807"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="799" height="305" rx="10" fill="url(#bg)" stroke="#1C231A" stroke-width="1"/>

  <!-- header -->
  <rect x="22" y="20" width="30" height="30" rx="5" fill="none" stroke="#ADFF8F" stroke-width="1.6"/>
  <path d="M31 30 l6 5 -6 5" fill="none" stroke="#ADFF8F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="39" y1="40" x2="45" y2="40" stroke="#ADFF8F" stroke-width="1.8" stroke-linecap="round"/>
  <text x="64" y="34" class="mono" font-size="14" font-weight="700" fill="#DAE5D8">Linux</text>
  <text x="64" y="48" class="mono" font-size="9.5" fill="#7E887C" letter-spacing="2">NVIDIA GPU · CPU</text>
  <line x1="22" y1="68" x2="778" y2="68" stroke="#1C231A" stroke-width="1"/>

  <!-- column headers -->
  <text x="34"  y="88" class="mono col">VRAM</text>
  <text x="164" y="88" class="mono col">RAM</text>
  <text x="262" y="88" class="mono col">MODEL (AUTO-DEFAULT)</text>
  <text x="560" y="88" class="mono col">CONTEXT</text>
  <text x="662" y="88" class="mono col">SPEED</text>

  <!-- row 1 · 24GB+ VRAM with 48GB+ RAM → Strata -->
  <rect x="22" y="98" width="756" height="34" rx="6" fill="#13200E" stroke="#3A5C28" stroke-width="1"/>
  <rect x="22" y="98" width="3" height="34" rx="1.5" fill="#ADFF8F"/>
  <text x="34"  y="119" class="mono spec" fill="#ADFF8F">24 GB+</text>
  <text x="164" y="119" class="mono spec" fill="#ADFF8F">48 GB+</text>
  <text x="262" y="119" class="mono val">Qwen3.8-Flash-Next</text>
  <text x="560" y="119" class="mono val">auto</text>
  <text x="662" y="119" class="mono val">~80 to 160 tok/s</text>
  <line x1="22" y1="132" x2="778" y2="132" stroke="#141A12" stroke-width="1"/>

  <!-- row 2 · same card, under 48GB RAM → full-accuracy Qwen3.8-27B -->
  <text x="34"  y="155" class="mono val-dim">24 GB+</text>
  <text x="164" y="155" class="mono val-dim">under 48 GB</text>
  <text x="262" y="155" class="mono val-dim">Qwen3.8-27B-UD-Q4_K_M</text>
  <text x="560" y="155" class="mono val-dim">168k</text>
  <text x="662" y="155" class="mono val-dim">~45 to 70 tok/s</text>
  <line x1="22" y1="168" x2="778" y2="168" stroke="#141A12" stroke-width="1"/>

  <!-- row 3 · 16GB VRAM → Qwen3.8-27B IQ3_XXS -->
  <text x="34"  y="191" class="mono val-dim">16 GB</text>
  <text x="164" y="191" class="mono val-dim">any</text>
  <text x="262" y="191" class="mono val-dim">Qwen3.8-27B-UD-IQ3_XXS</text>
  <text x="560" y="191" class="mono val-dim">96k</text>
  <text x="662" y="191" class="mono val-dim">~20 to 42 tok/s</text>
  <line x1="22" y1="204" x2="778" y2="204" stroke="#141A12" stroke-width="1"/>

  <!-- row 4 · 12GB VRAM → Bonsai PQ2_0 -->
  <text x="34"  y="227" class="mono val-dim">12 GB</text>
  <text x="164" y="227" class="mono val-dim">any</text>
  <text x="262" y="227" class="mono val-dim">Ternary-Bonsai-2-27B PQ2_0</text>
  <text x="560" y="227" class="mono val-dim">96k</text>
  <text x="662" y="227" class="mono val-dim">~28 to 32 tok/s</text>
  <line x1="22" y1="240" x2="778" y2="240" stroke="#141A12" stroke-width="1"/>

  <!-- row 5 · CPU → Qwen3.6-35B-A3B. AMD and other GPUs are not supported. -->
  <text x="34"  y="263" class="mono val-dim">CPU</text>
  <text x="164" y="263" class="mono val-dim">~20 GB</text>
  <text x="262" y="263" class="mono val-dim">Qwen3.6-35B-A3B</text>
  <text x="560" y="263" class="mono val-dim">168k</text>
  <text x="662" y="263" class="mono val-dim">~8 to 20 tok/s</text>

  <line x1="22" y1="276" x2="778" y2="276" stroke="#1C231A" stroke-width="1"/>
  <text x="34" y="292" class="mono foot">Contexts are as shipped, with vision on. AMD and other GPUs are not supported yet.</text>
</svg>
